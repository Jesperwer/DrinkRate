name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Copies site/ onto the gh-pages branch, which GitHub Pages serves.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish site/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SRC_SHA=$(git rev-parse --short HEAD)
          cp -r site /tmp/site
          git checkout gh-pages
          git rm -rq --ignore-unmatch .
          cp -r /tmp/site/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Publish site from $SRC_SHA"
          git push origin gh-pages

  # Checks that the Supabase database is set up (supabase/setup.sql has been run).
  # Reads the URL and key straight from site/config.js. Does not block the deploy.
  database-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call dr_list_users
        run: |
          URL=$(sed -n 's/^ *url: "\(.*\)",/\1/p' site/config.js)
          KEY=$(sed -n 's/^ *key: "\(.*\)",/\1/p' site/config.js)
          echo "Project: $URL"
          CODE=$(curl -sS -o body.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/dr_list_users" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $CODE"; cat body.txt; echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Database is not set up yet. Run supabase/setup.sql in the Supabase SQL Editor."
            exit 1
          fi
          echo "Database OK"
